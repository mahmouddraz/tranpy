# Databricks Asset Bundle: v4-dyn fault-event simulation of the frozen model v4final on a classic single-node
# job cluster (prep -> sim slots -> finalize) plus a serverless merge into Delta.
#
# Inputs (wheels, frozen model, v4g hour inputs, events_v2 scripts, SHA256SUMS) are uploaded to the
# volume ${var.inputs}; every task checks them against SHA256SUMS and the frozen sha256 tables.
# Outputs go to ${var.outputs}/RUN_NAME (job parameter run_name, default the job run id). To resume a failed
# or cancelled run, start the job again with run_name=<that run's name>: finished shards are skipped.
#
#   cd databricks/grid_transient_stability
#   databricks bundle validate --strict -p eaib-dev
#   databricks bundle deploy -p eaib-dev
#   databricks bundle run fault_events -p eaib-dev                      # full run (n=600, shard 50)
#   databricks bundle run fault_events -p eaib-dev --params n=6,shard=3,grid_lines=1,grid_clr=.1\,.3,trace_stable=18,trace_cand=4,shards_per_item=1,table_prefix=smoke2_
bundle:
  name: tranpy-grid-transient-stability

include:
  - resources/*.yml

sync:
  paths:
    - src
    - config

variables:
  catalog:
    default: energyai_dbw_dev
  schema:
    default: grid_transient_stability
  inputs:
    description: Volume folder with wheels/, work/ and SHA256SUMS.
    default: /Volumes/energyai_dbw_dev/grid_transient_stability/inputs/v41dyn
  outputs:
    description: Volume folder for the per-run case outputs.
    default: /Volumes/energyai_dbw_dev/grid_transient_stability/outputs/v41dyn
  spark_version:
    description: Databricks Runtime of the job cluster (17.3 LTS = Python 3.12.3; numpy 2.5.4 / pandas 3.1.0 need >= 3.12).
    default: 17.3.x-scala2.13
  node_type:
    description: VM of the single-node job cluster (subscription quota is 10 vCPUs per VM family in eastus).
    default: Standard_F8as_v7
  jobs:
    description: gen.py worker processes per sim slot (slots x jobs = cores of node_type).
    default: "4"
  par:
    description: cases prepared / finalized in parallel.
    default: "4"
  # timeouts ~3x the expected time on F8as_v7 (7.4 s per event per worker, 4 workers x 2 slots):
  # prep ~2 min, each sim slot ~3.0 h for the full run, finalize ~3 min
  prep_timeout_s:
    default: "1800"
  sim_timeout_s:
    default: "32400"
  finalize_timeout_s:
    default: "1800"
  job_timeout_s:
    default: "50400"
  ml_inputs:
    description: Volume folder with the wheel of the ML job (kept apart from the simulation inputs and their SHA256SUMS).
    default: /Volumes/energyai_dbw_dev/grid_transient_stability/inputs/ml
  ml_outputs:
    description: Volume folder for ML features, selections and logs (one folder per ML job run).
    default: /Volumes/energyai_dbw_dev/grid_transient_stability/outputs/ml
  ml_git_commit:
    description: tranpy commit of the ML wheel (plus uncommitted files).
    default: 863a45c + uncommitted steps 1-3 (CI, protocols, line features, tuning; wheel sha256 87761afb; UC tag split fix, SIME first-swing rules, ml_windows)
  git_commit:
    description: tranpy commit the wheel was built from (plus uncommitted files).
    default: 863a45c + uncommitted v4.1 German FCR (grid_case.py sha256 27b6bade...)
  table_prefix:
    description: Prefix of the Delta tables the fault_events merge writes (default job parameter).
    default: ""
  replay:
    description: fault_events replay parquet (case, shard, sample_id) on the volume; empty = full run.
    default: ""
  frozen_dyn:
    description: FROZEN_DYN table file of the input set checked by the tasks; empty = common.FROZEN_DYN.
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-936064419514239.19.azuredatabricks.net
  # Replay of the v4.1 stored trace sample with the fixed trace writer (FROZEN_DYN_v41_traces.md):
  # separate input set, output folder, table prefix and job names, so the dev target (and the
  # tsa_ml job reading outputs/v41dyn and the unprefixed tables) stays as it is.
  #   databricks bundle deploy -t traces -p eaib-dev
  #   databricks bundle run fault_events -t traces -p eaib-dev --no-wait
  traces:
    mode: development
    presets:
      name_prefix: "[traces ${workspace.current_user.short_name}] "
    workspace:
      host: https://adb-936064419514239.19.azuredatabricks.net
    variables:
      inputs: /Volumes/energyai_dbw_dev/grid_transient_stability/inputs/v41dyn_traces
      outputs: /Volumes/energyai_dbw_dev/grid_transient_stability/outputs/v41dyn_traces
      replay: /Volumes/energyai_dbw_dev/grid_transient_stability/inputs/v41dyn_traces/replay/trace_sample_v41.parquet
      frozen_dyn: FROZEN_DYN_v41_traces.md
      table_prefix: v41t_
      git_commit: 863a45c + uncommitted v4.1 German FCR (grid_case.py sha256 27b6bade...) + replay of the stored trace sample of run 738439695169033 with the fixed trace writer (FROZEN_DYN_v41_traces.md)
      # 2,328 events x ~7.4 s / (2 slots x 4 workers) ~ 36 min of simulation per slot (3x margin)
      sim_timeout_s: "7200"
      job_timeout_s: "14400"
