# Transient-stability classification benchmark on the v4-dyn fault events (tranpy.ml_benchmark).
# Every model is crossed with every imbalance option; `extra` adds models whose balancing is built in.
# Evaluation protocols (every candidate runs under each; tranpy.ml_benchmark.PROTOCOLS):
#   hour    leave one operating hour out (t10 and t20 of an hour held out together): the
#           generalisation estimate, and the protocol on which the best candidate is selected
#   random  stratified 5-fold, shuffled with the seed: the usual i.i.d. estimate, reported for
#           comparison (optimistic when events of one hour are near duplicates)
#   line    stratified group 5-fold grouped by the faulted line (not run by default)
# Out-of-fold predictions are pooled and reported per stratum; every pooled metric gets a 95 %
# stratified bootstrap interval (1000 resamples, this seed) as <metric>_lo / <metric>_hi.
# Ranking and gate: higher PR-AUC; candidates inside the leader's interval are ties, settled by
# the lower miss rate (a challenger with a higher miss rate beyond the interval is never promoted).
seed: 20261104
protocols: [hour, random]
report_by: [hour, clearing_band, kind, event_type, tan_phi]
primary_metric: average_precision

# system_* : system-level statistics; aligned_* : per machine, aligned by stable machine id.
# *_pre : before the fault; *_clear : pre-fault plus the faulted state at the clearing instant.
feature_sets: [system_pre, system_clear, aligned_pre, aligned_clear]

models:
  - logistic_regression
  - random_forest
  - extra_trees
  - lightgbm
  - xgboost
  - dense_network

# Established options only (scikit-learn / imbalanced-learn); see tranpy_core.imbalance.
imbalance:
  - none
  - class_weight
  - undersample
  - smote
  - {method: class_weight, threshold: f1}

extra:
  - {model: balanced_random_forest}
  - {model: easy_ensemble}

# One thread per fit: candidates run in parallel processes on the node.
params:
  logistic_regression: {max_iter: 2000}
  random_forest: {n_estimators: 300, n_jobs: 1}
  extra_trees: {n_estimators: 300, n_jobs: 1}
  lightgbm: {n_estimators: 300, n_jobs: 1}
  xgboost: {n_estimators: 300, n_jobs: 1}
  balanced_random_forest: {n_estimators: 300, n_jobs: 1}
  easy_ensemble: {n_estimators: 10, n_jobs: 1}
  dense_network: {hidden_units: [64, 32], epochs: 60, batch_size: 64, early_stopping_patience: 8}
