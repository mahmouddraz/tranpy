resources:
  jobs:
    grid_pipeline:
      name: tranpy-grid-pipeline
      description: German transmission grid model - downloads the sources, builds the cleaned network and the CIM-aligned model, verifies it with an AC power flow.

      environments:
        - environment_key: tranpy
          spec:
            environment_version: "5"
            dependencies:
              - ../../dist/*.whl
              - pypowsybl>=1.10
              - matplotlib>=3.8
              - pyarrow>=15

      # Job environment variables (serverless, environment version 5+; Beta: a workspace
      # admin enables "Environment variables in Lakeflow Jobs" under Previews).
      environment_variables:
        - environment_variables_key: grid
          spec:
            variables:
              TRANPY_CATALOG: ${var.catalog}
              TRANPY_BRONZE_SCHEMA: ${resources.schemas.grid_bronze.name}
              TRANPY_SILVER_SCHEMA: ${resources.schemas.grid_silver.name}
              TRANPY_GOLD_SCHEMA: ${resources.schemas.grid_gold.name}
              TRANPY_FILES: /Volumes/${var.catalog}/${resources.schemas.grid_bronze.name}/${resources.volumes.grid_files.name}
              TRANPY_PLANTS_TABLE: ${var.plants_table}
              TRANPY_POPULATION_TABLE: ${var.population_table}
              TRANPY_CACHE_DIR: /Volumes/${var.catalog}/${resources.schemas.grid_bronze.name}/${resources.volumes.grid_files.name}/cache

      tasks:
        - task_key: bronze
          environment_key: tranpy
          environment_variables_key: grid
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters: ["bronze"]
          timeout_seconds: 3600
          max_retries: 1

        - task_key: silver
          depends_on: [{task_key: bronze}]
          environment_key: tranpy
          environment_variables_key: grid
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters: ["silver"]
          timeout_seconds: 3600

        - task_key: gold
          depends_on: [{task_key: silver}]
          environment_key: tranpy
          environment_variables_key: grid
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters: ["gold"]
          timeout_seconds: 3600

        - task_key: verify
          depends_on: [{task_key: gold}]
          environment_key: tranpy
          environment_variables_key: grid
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters: ["verify"]
          timeout_seconds: 1800

      max_concurrent_runs: 1
      queue:
        enabled: true
      tags:
        project: tranpy
        pipeline: german-grid-model
