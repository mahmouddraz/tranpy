resources:
  jobs:
    grid_pipeline:
      name: tranpy-grid-pipeline
      description: German transmission grid model - downloads the sources, builds the cleaned network and the CIM-aligned model, verifies it with an AC power flow.

      # Serverless; the tranpy wheel is built by the bundle (see databricks.yml).
      environments:
        - environment_key: tranpy
          spec:
            environment_version: "5"
            dependencies:
              - ../../dist/*.whl
              - pypowsybl>=1.10
              - matplotlib>=3.8
              - pyarrow>=15
              - openpyxl>=3.1

      # Settings of a run: visible and overridable per run in the job UI.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.grid_bronze.name}
        - name: silver_schema
          default: ${resources.schemas.grid_silver.name}
        - name: gold_schema
          default: ${resources.schemas.grid_gold.name}
        - name: files
          default: /Volumes/${var.catalog}/${resources.schemas.grid_bronze.name}/${resources.volumes.grid_files.name}
        - name: plants_table
          default: ${var.plants_table}
        - name: population_table
          default: ${var.population_table}

      tasks:
        - task_key: bronze
          environment_key: tranpy
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters:
              - bronze
              - "--catalog={{job.parameters.catalog}}"
              - "--bronze-schema={{job.parameters.bronze_schema}}"
              - "--silver-schema={{job.parameters.silver_schema}}"
              - "--gold-schema={{job.parameters.gold_schema}}"
              - "--files={{job.parameters.files}}"
              - "--plants-table={{job.parameters.plants_table}}"
              - "--population-table={{job.parameters.population_table}}"
          timeout_seconds: 3600
          max_retries: 1

        - task_key: silver
          depends_on: [{task_key: bronze}]
          environment_key: tranpy
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters:
              - silver
              - "--catalog={{job.parameters.catalog}}"
              - "--bronze-schema={{job.parameters.bronze_schema}}"
              - "--silver-schema={{job.parameters.silver_schema}}"
              - "--gold-schema={{job.parameters.gold_schema}}"
              - "--files={{job.parameters.files}}"
              - "--plants-table={{job.parameters.plants_table}}"
              - "--population-table={{job.parameters.population_table}}"
          timeout_seconds: 3600

        - task_key: gold
          depends_on: [{task_key: silver}]
          environment_key: tranpy
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters:
              - gold
              - "--catalog={{job.parameters.catalog}}"
              - "--bronze-schema={{job.parameters.bronze_schema}}"
              - "--silver-schema={{job.parameters.silver_schema}}"
              - "--gold-schema={{job.parameters.gold_schema}}"
              - "--files={{job.parameters.files}}"
              - "--plants-table={{job.parameters.plants_table}}"
              - "--population-table={{job.parameters.population_table}}"
          timeout_seconds: 3600

        - task_key: verify
          depends_on: [{task_key: gold}]
          environment_key: tranpy
          python_wheel_task:
            package_name: tranpy_ai
            entry_point: tranpy-grid
            parameters:
              - verify
              - "--catalog={{job.parameters.catalog}}"
              - "--bronze-schema={{job.parameters.bronze_schema}}"
              - "--silver-schema={{job.parameters.silver_schema}}"
              - "--gold-schema={{job.parameters.gold_schema}}"
              - "--files={{job.parameters.files}}"
              - "--plants-table={{job.parameters.plants_table}}"
              - "--population-table={{job.parameters.population_table}}"
          timeout_seconds: 1800

      max_concurrent_runs: 1
      queue:
        enabled: true
      tags:
        project: tranpy
        pipeline: german-grid-model
