[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tranpy-ai"
version = "0.2.0.dev0"
description = "Machine learning for power-system transient stability: datasets, models, evaluation and explanation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mahmoud Draz", email = "m.draz@tu-berlin.de" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.5,<1.11",  # SVC(probability=True) is removed in 1.11
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["power-system", "transient-stability", "machine-learning", "explainability"]

[project.urls]
Homepage = "https://github.com/mahmouddraz/tranpy"
Repository = "https://github.com/mahmouddraz/tranpy"
Issues = "https://github.com/mahmouddraz/tranpy/issues"

[project.optional-dependencies]
explain = ["shap>=0.45", "lime>=0.2.0.1", "dalex>=1.7", "setuptools<85"]
neural = ["tensorflow>=2.16"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
plot = ["matplotlib>=3.8"]
persistence = ["skops>=0.10"]
all = ["tranpy-ai[explain,neural,boosting,plot,persistence]"]

[project.scripts]
tranpy = "tranpy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]
notebooks = ["jupyter>=1.0", "nbconvert>=7.16", "ipykernel>=6.29"]
docs = ["sphinx>=7.0", "myst-parser>=3.0", "sphinx-rtd-theme>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tranpy_core", "src/tranpy"]
exclude = ["src/tranpy/data/datasets/events"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["src/tranpy/data/datasets/events"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["papers", "examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PT", "RUF", "C4", "PIE", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PT018"]
"scripts/**" = ["T20"]
"src/tranpy/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["shap.*", "lime.*", "dalex.*", "xgboost.*", "lightgbm.*", "tensorflow.*", "keras.*", "sklearn.*", "scipy.*", "skops.*", "powerfactory", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
filterwarnings = [
    "error",
    # expected with the documented default hyperparameters on small test data
    "ignore::sklearn.exceptions.ConvergenceWarning",
    # SVC(probability=True) is kept for continuity of results until scikit-learn 1.11
    "ignore:The `probability` parameter was deprecated:FutureWarning",
]
markers = [
    "slow: long-running test (deselect with -m 'not slow')",
    "requires_explain: needs the [explain] extra",
    "requires_neural: needs the [neural] extra",
    "requires_boosting: needs the [boosting] extra",
    "requires_plot: needs the [plot] extra",
    "requires_persistence: needs the [persistence] extra",
]

[tool.coverage.run]
source = ["tranpy_core", "tranpy"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
