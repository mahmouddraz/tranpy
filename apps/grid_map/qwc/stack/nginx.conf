server {
    listen       80;
    server_name  localhost;
    # Increase this if the config-generator returns timeout errors
    proxy_read_timeout 90;
    # Relevant i.e. for file uploads
    client_max_body_size 10M;

    proxy_redirect     off;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Disables emitting nginx version on error pages and in the “Server” response header field.
    # http://nginx.org/en/docs/http/ngx_http_core_module.html#server_tokens
    server_tokens off;

    # Re-resolve container names (IPs change when containers are recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;




    location /api/v1/featureinfo {
        set $up_qwc_feature_info_service qwc-feature-info-service;
        proxy_pass http://$up_qwc_feature_info_service:9090;
    }

    location /api/v1/legend {
        set $up_qwc_legend_service qwc-legend-service;
        proxy_pass http://$up_qwc_legend_service:9090;
    }


    location /api/v1/permalink {
        set $up_qwc_permalink_service qwc-permalink-service;
        proxy_pass http://$up_qwc_permalink_service:9090;
    }

    location /api/v1/print {
        set $up_qwc_print_service qwc-print-service;
        proxy_pass http://$up_qwc_print_service:9090;
    }



    location /auth/ {
        set $up_qwc_auth_service qwc-auth-service;
        proxy_pass http://$up_qwc_auth_service:9090;
    }

    location /ows {
        set $up_qwc_ogc_service qwc-ogc-service;
        proxy_pass http://$up_qwc_ogc_service:9090;
    }

    # location /api/v1/tileinfo {
    #     proxy_pass http://qwc-3d-tile-info-service:9090;
    # }

    # location /api/v1/oblique-imagery {
    #     proxy_pass http://qwc-oblique-imagery-service:9090;
    # }

    # location /registration {
    #     proxy_pass http://qwc-registration-gui:9090;
    # }

    location / {
        set $up_qwc_map_viewer qwc-map-viewer;
        proxy_pass http://$up_qwc_map_viewer:9090;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
